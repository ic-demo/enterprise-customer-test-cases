name: Quick Workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # lets you run it manually from the Actions tab

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Show repo contents
        run: ls -la
